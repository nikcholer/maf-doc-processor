name: Release baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  verify:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore
        run: dotnet restore ./MafDocumentProcessor.sln '-warnaserror:NU1901;NU1902;NU1903;NU1904'

      - name: Build Release configuration
        run: dotnet build ./MafDocumentProcessor.sln --configuration Release --no-restore

      - name: Run offline .NET tests
        run: dotnet test ./MafDocumentProcessor.sln --configuration Release --no-build --no-restore

      - name: Run UI tests
        run: node --test ./tests/ui/capture-ui.test.cjs

      - name: Audit vulnerable dependencies
        run: |
          set -euo pipefail
          report=$(mktemp)
          dotnet list ./MafDocumentProcessor.sln package --vulnerable --include-transitive --no-restore --format json | tee "$report"
          python3 - "$report" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          hits = []
          for project in data.get("projects") or []:
              for framework in project.get("frameworks") or []:
                  packages = list(framework.get("topLevelPackages") or [])
                  packages.extend(framework.get("transitivePackages") or [])
                  for package in packages:
                      if package.get("vulnerabilities"):
                          hits.append(package)

          if hits:
              names = sorted({hit.get("id") or hit.get("name") or "unknown" for hit in hits})
              print("Vulnerable packages reported: " + ", ".join(names))
              raise SystemExit(1)
          PY
